# Codemagic-Build fuer die Vela iOS-App (Ad-Hoc .ipa zum Sideloaden).
#
# EINMALIGE EINRICHTUNG in Codemagic (Web-UI):
#  1. App verbinden (dieses GitHub-Repo).
#  2. Teams / Integrations -> App Store Connect: API-Key hinterlegen
#     (in Apple: Users and Access -> Integrations -> App Store Connect API -> Key erzeugen).
#     Den Integrations-Namen unten bei `app_store_connect` eintragen (hier: "vela_asc").
#  3. iPhone-UDID im Apple Developer Portal registrieren
#     (Devices -> +, UDID: 00008150-0016428234B9401C) ODER Codemagic legt es beim
#     Ad-Hoc-Build automatisch an, wenn die API-Rolle das darf.
#  4. Bundle-ID: com.vela.velaplayer (muss als Identifier im Apple-Portal existieren;
#     app-store-connect fetch-signing-files ... --create legt ihn sonst an).
#
# Danach: Build starten -> fertige .ipa unter Artifacts herunterladen ->
# mit Sideloadly/3uTools aufs iPhone.

workflows:

  # Unsignierte .ipa – braucht KEIN Apple-Konto. Mit Sideloadly (eigene Apple-ID)
  # signieren + aufs iPhone installieren. Für sofortigen Test, solange die
  # Developer-Mitgliedschaft noch nicht freigeschaltet ist.
  ios-unsigned:
    name: Vela iOS (unsigniert, fuer Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: Unsigniert bauen
        script: flutter build ios --release --no-codesign
      - name: Als .ipa verpacken
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r vela-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/vela-unsigned.ipa
    publishing:
      email:
        recipients:
          - okan_2oo8@hotmail.de

  ios-adhoc:
    name: Vela iOS (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.vela.velaplayer
      vars:
        BUNDLE_ID: "com.vela.velaplayer"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: vela_asc
    scripts:
      - name: Code-Signing vorbereiten
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: .ipa bauen
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - okan_2oo8@hotmail.de
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------------
  # NINA (unsigniert) — dieselbe Codebasis, per BRAND=nina umgeskinnt
  # (Grün, Nina-Logo/Name, 2x2-Home). Eigene Bundle-ID + Anzeigename,
  # damit Nina NEBEN Vela aufs iPhone passt. Läuft NUR manuell (kein
  # Push-Trigger) — in Codemagic "Start new build" -> diesen Workflow.
  # ------------------------------------------------------------------
  ios-nina-unsigned:
    name: Nina iOS (unsigniert, fuer Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Auf Nina umstellen (Name + Bundle-ID + Icon)
        script: |
          plutil -replace CFBundleDisplayName -string "Nina" ios/Runner/Info.plist
          sed -i '' 's/com\.vela\.velaplayer/com.nina.ninaplayer/g' ios/Runner.xcodeproj/project.pbxproj
          cp ios_nina_icons/*.png ios/Runner/Assets.xcassets/AppIcon.appiconset/
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: Unsigniert bauen (BRAND=nina)
        script: flutter build ios --release --no-codesign --dart-define=BRAND=nina
      - name: Als .ipa verpacken
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r nina-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/nina-unsigned.ipa
    publishing:
      email:
        recipients:
          - okan_2oo8@hotmail.de
