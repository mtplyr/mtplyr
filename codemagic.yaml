# Codemagic-Builds fuer die Vela iOS-App.
#
# >>> PRIMAER: Workflow "ios-testflight" — baut eine signierte .ipa und laedt
#     sie zu TestFlight hoch. Die App kommt dann ueber die Apple-"TestFlight"-App
#     aufs iPhone (KEIN Kabel/Sideloadly noetig). Das ist der Weg, den du willst.
#
# EINMALIGE EINRICHTUNG in Codemagic (Web-UI) — gilt fuer TestFlight & Ad-Hoc:
#  1. App verbinden (dieses GitHub-Repo).
#  2. Apple API-Key erzeugen: Apple Developer -> Users and Access -> Integrations
#     -> App Store Connect API -> Key erstellen (Rolle "App Manager" oder "Admin").
#     In Codemagic unter Teams -> Integrations -> App Store Connect hinterlegen und
#     den Integrations-Namen "vela_asc" vergeben (genau so heisst er unten).
#  3. In App Store Connect eine App anlegen: Apps -> + -> Neue App, Plattform iOS,
#     Bundle-ID com.vela.velaplayer, Name "Vela", SKU frei (z.B. vela1).
#     (Die Bundle-ID muss im Developer-Portal existieren; fetch-signing-files
#     --create legt sie sonst automatisch an.)
#
# Danach: in Codemagic "Start new build" -> Workflow "Vela iOS (TestFlight)".
# Nach ~15 Min ist der Build in App Store Connect -> TestFlight. Auf dem iPhone
# die "TestFlight"-App aus dem App Store laden, mit deiner Apple-ID anmelden ->
# Vela erscheint zum Testen.
#
# Die anderen Workflows (unsigniert / Ad-Hoc) sind Sideload-Fallbacks und laufen
# nur manuell (kein Auto-Trigger).

workflows:

  # ==================================================================
  # TESTFLIGHT — der saubere Weg aufs iPhone. Baut eine signierte
  # App-Store-.ipa und laedt sie automatisch zu App Store Connect ->
  # TestFlight hoch. Start ueber "Start new build" in Codemagic (manuell).
  # Braucht: Apple-Developer-Mitgliedschaft + Integration "vela_asc"
  # + App in App Store Connect mit Bundle-ID com.vela.velaplayer.
  # ==================================================================
  ios-testflight:
    name: Vela iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.vela.velaplayer"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: vela_asc
    # KEIN "ios_signing"-Block: der wuerde beim Start ein FERTIGES Profil
    # erwarten und sonst sofort abbrechen ("No matching profiles found").
    # Der Schritt unten legt Zertifikat + Profil per --create selbst an.
    scripts:
      - name: Code-Signing vorbereiten (App Store)
        script: |
          keychain initialize
          # Distribution-Zertifikat MIT privatem Schluessel beschaffen:
          # neu erstellen (Codemagic behaelt den Key). Falls das Apple-Limit
          # erreicht ist, stattdessen vorhandene Zertifikate laden.
          app-store-connect create-certificate --type IOS_DISTRIBUTION --save \
            || app-store-connect list-certificates --type IOS_DISTRIBUTION --save
          # Provisioning-Profil holen/erstellen
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: .ipa bauen (App Store, Build-Nr. automatisch hochzaehlen)
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - okan_2oo8@hotmail.de
        notify:
          success: true
          failure: true

  # Unsignierte .ipa – braucht KEIN Apple-Konto. Mit Sideloadly (eigene Apple-ID)
  # signieren + aufs iPhone installieren. Für sofortigen Test, solange die
  # Developer-Mitgliedschaft noch nicht freigeschaltet ist.
  ios-unsigned:
    name: Vela iOS (unsigniert, fuer Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: Unsigniert bauen
        script: flutter build ios --release --no-codesign
      - name: Als .ipa verpacken
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r vela-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/vela-unsigned.ipa
    publishing:
      email:
        recipients:
          - okan_2oo8@hotmail.de

  ios-adhoc:
    name: Vela iOS (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.vela.velaplayer
      vars:
        BUNDLE_ID: "com.vela.velaplayer"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: vela_asc
    scripts:
      - name: Code-Signing vorbereiten
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: .ipa bauen
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - okan_2oo8@hotmail.de
        notify:
          success: true
          failure: true

  # ------------------------------------------------------------------
  # NINA (unsigniert) — dieselbe Codebasis, per BRAND=nina umgeskinnt
  # (Grün, Nina-Logo/Name, 2x2-Home). Eigene Bundle-ID + Anzeigename,
  # damit Nina NEBEN Vela aufs iPhone passt. Läuft NUR manuell (kein
  # Push-Trigger) — in Codemagic "Start new build" -> diesen Workflow.
  # ------------------------------------------------------------------
  ios-nina-unsigned:
    name: Nina iOS (unsigniert, fuer Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Auf Nina umstellen (Name + Bundle-ID + Icon)
        script: |
          plutil -replace CFBundleDisplayName -string "Nina" ios/Runner/Info.plist
          sed -i '' 's/com\.vela\.velaplayer/com.nina.ninaplayer/g' ios/Runner.xcodeproj/project.pbxproj
          cp ios_nina_icons/*.png ios/Runner/Assets.xcassets/AppIcon.appiconset/
      - name: Flutter-Pakete
        script: flutter pub get
      - name: Pods installieren
        script: find . -name "Podfile" -execdir pod install \;
      - name: Unsigniert bauen (BRAND=nina)
        script: flutter build ios --release --no-codesign --dart-define=BRAND=nina
      - name: Als .ipa verpacken
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r nina-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/nina-unsigned.ipa
    publishing:
      email:
        recipients:
          - okan_2oo8@hotmail.de
